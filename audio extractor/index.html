<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio extractor</title>
    <script src="./ffmpeg/ffmpeg.js"></script>
    <link rel="stylesheet" href="../base.css">
</head>

<body>
    <div id="container">
        <label class="drop-zone">
            <input type="file" id="fileInput" accept="video/*,.mkv,.webm,.mov,.avi" />

            <div class="drop-content">
                <div class="icon"></div>
            </div>

            <div id="statusBar" class="status-bar">
                <div class="progress">
                    <div id="progressFill"></div>
                </div>
            </div>
        </label>
        <p>MP4, MKV, WEBM, MOV, AVI<br>conversion is local</p>
    </div>

    <script>
        const { FFmpeg } = FFmpegWASM;

        const ffmpeg = new FFmpeg({
            classWorkerURL: './ffmpeg/814.ffmpeg.js'
        });

        const progressFill = document.getElementById('progressFill');

        ffmpeg.on('progress', ({ progress }) => {
            // 0-1
            progressFill.style.width = `${progress * 100}%`;
        });

        ffmpeg.on('log', ({ message }) => {
            console.log(message);
        });

        const fileInput = document.getElementById('fileInput');
        const statusBar = document.getElementById('statusBar');
        const icon = document.querySelector('.icon');
        const container = document.getElementById("container");

        const setLoading = (state) => {
            statusBar.classList.toggle('active', state);
            icon.style.visibility = state ? 'hidden' : 'visible';
            container.style.pointerEvents = state ? 'none' : 'all';
        };

        fileInput.addEventListener('change', () => {
            const file = fileInput.files?.[0];
            if (file) convert(file);
        });

        const fileToArray = (file) =>
            new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result);
                r.onerror = reject;
                r.readAsArrayBuffer(file);
            });

        async function convert(file) {
            setLoading(true);

            try {
                if (!ffmpeg.loaded) await ffmpeg.load();

                const data = new Uint8Array(await fileToArray(file));

                const inputName = `input.${file.name.split('.').pop()}`;
                await ffmpeg.writeFile(inputName, data);

                await ffmpeg.exec([
                    '-i', inputName,
                    '-vn',
                    '-acodec', 'libmp3lame',
                    '-ar', '44100',
                    '-ac', '2',
                    'output.mp3'
                ]);

                const mp3 = await ffmpeg.readFile('output.mp3');
                const blob = new Blob([mp3.buffer], { type: 'audio/mp3' });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'audio.mp3';
                a.click();
                a.remove();

            } catch (e) {
                console.error(e);
            } finally {
                setLoading(false);
            }
        }
    </script>
</body>

</html>
