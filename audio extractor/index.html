<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio extractor</title>
    <script src="../ffmpeg/ffmpeg.js"></script>
    <link rel="stylesheet" href="../base.css">
</head>

<body>
    <header>
        <a onclick="window.top.location = window.top.location.href.includes('github.io') ? window.location.origin + '/local-tools' : window.location.origin" class="wordmark"></a>
    </header>

    <main>
        <div id="container">
            <label id="drop-zone">
                <input type="file" id="fileInput" accept="video/*,.mkv,.webm,.mov,.avi" />

                <div class="drop-content">
                    <div class="icon"></div>
                </div>

                <div id="statusBar" class="status-bar">
                    <div class="progress">
                        <div id="progressFill"></div>
                    </div>
                </div>
            </label>
            <p id="status">0%</p>
            <p id="details">MP4, MKV, WEBM, MOV, AVI<br>conversion is local</p>
        </div>
    </main>

    <script src="index.js"></script>
</body>

</html>
